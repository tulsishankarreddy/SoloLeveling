<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060A18">
  <meta name="description" content="A personal leveling System: daily quests, XP, stats, ranks and penalties.">
  <title>The System</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <span class="brand">The System</span>
      <button id="syncPill" class="sync-pill" data-act="sync" hidden>Sync</button>
      <button class="icon-btn" data-act="view" data-view="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
      </button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabs" aria-label="Main">
      <button data-act="view" data-view="status">Status</button>
      <button data-act="view" data-view="quests">Quests</button>
      <button data-act="view" data-view="shop">Shop</button>
      <button data-act="view" data-view="bag">Inventory</button>
    </nav>
  </div>
  <div id="layer" class="layer" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
